# Note: This GitLab CI configuration is used for internal testing, users can ignore it.
include:
  - template: Security/SAST.gitlab-ci.yml
  - project: '${CI_PROJECT_NAMESPACE}/ci-libs-for-client-libraries'
    file:
      - '/${CI_PROJECT_NAME}/.gitlab-ci.yml'
  - project: 'deepl-org/deepl/devex/gitlab-ci-lib'
    file:
      - '/templates/.buildkit.yml'
      - '/templates/.secret-detection.yml'

variables:
  DOCKER_IMAGE_PREFIX: ${CONTAINER_REGISTRY}/deepl/${HARBOR_REGISTRY_PROJECT}/${CI_PROJECT_NAME}-build
  COMPOSER_HOME: /.composer

# Global --------------------------

cache:
  key:
    files:
      - composer.json
      - composer.lock
  paths:
    - vendor/
    - /.composer

workflow:
  rules:
    # The tag pipeline must run: that is where the registry publish job fires.
    - if: $CI_COMMIT_TAG
    # The release commit carries only the version and the changelog, both
    # derived from commits that were already checked on the way in.
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - build
  - check
  - test
  - publish

before_script:
  # Install project dependencies using Composer
  - php /composer.phar install

# stage: build ---------------------

build image:
  stage: build
  extends: .buildkit
  variables:
    DOCKER_IMAGE: ${DOCKER_IMAGE_PREFIX}_${PHP_VERSION}
    BUILDKIT_IMAGE: ${DOCKER_IMAGE}:latest
    BUILDKIT_EXTRA_ARGS: "--opt build-arg:PHP_VERSION=${PHP_VERSION}"
  parallel:
    matrix:
      - PHP_VERSION: "8.5-alpine"
      - PHP_VERSION: "8.4-alpine"
      - PHP_VERSION: "8.3-alpine"
      - PHP_VERSION: "8.2-alpine"
      - PHP_VERSION: "8.1-alpine"
      - PHP_VERSION: "8.0-alpine"
      - PHP_VERSION: "7.4-alpine"
      - PHP_VERSION: "7.3-alpine"

# stage: check ----------------------

.code_sniffer_base:
  stage: check
  image: ${DOCKER_IMAGE_PREFIX}_8.3-alpine
  script:
    - vendor/bin/phpcs

code_sniffer_scheduled:
  extends: .code_sniffer_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

code_sniffer_manual:
  extends: .code_sniffer_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

.license_check_base:
  stage: check
  image: ${DOCKER_IMAGE_PREFIX}_8.3-alpine
  script:
    - ./license_checker.sh '*.php' | tee license_check_output.txt
    - '[ ! -s license_check_output.txt ]'

license_check_scheduled:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

license_check_manual:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

secret_detection:
  extends: .secret-detection
  stage: check
  image: !reference [.secret-detection, image]
  before_script:
    - echo "overriding default before_script..."
  rules:
    - if: $CI_MERGE_REQUEST_ID

semgrep-sast:
  stage: check
  before_script:
    - ''
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

# stage: test ----------------------

# The offline suite needs no API key and no network: it runs on every PHP version.
.test_offline_base:
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: "8.5-alpine"
      - PHP_VERSION: "8.4-alpine"
      - PHP_VERSION: "8.3-alpine"
      - PHP_VERSION: "8.2-alpine"
      - PHP_VERSION: "8.1-alpine"
      - PHP_VERSION: "8.0-alpine"
      - PHP_VERSION: "7.4-alpine"
      - PHP_VERSION: "7.3-alpine"
  image: ${DOCKER_IMAGE_PREFIX}_${PHP_VERSION}
  script:
    - echo $CI_PIPELINE_ID
    - >
      vendor/bin/phpunit --testsuite offline --order-by=random --random-order-seed $CI_PIPELINE_ID
      --log-junit reports/junit.xml --coverage-cobertura reports/cobertura.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/cobertura.xml
      junit:
        - reports/junit.xml
    when: always

test_offline_scheduled:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_offline_manual:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# The real-API suite sends one request per endpoint to the test API, once, on the newest PHP version.
# It has no retry: a rerun would repeat the requests.
.test_real_api_base:
  stage: test
  extends: .test
  variables:
    PHP_VERSION: "8.5-alpine"
  image: ${DOCKER_IMAGE_PREFIX}_${PHP_VERSION}
  script:
    - >
      vendor/bin/phpunit --testsuite realApi
      --log-junit reports/junit.xml --coverage-cobertura reports/cobertura.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/cobertura.xml
      junit:
        - reports/junit.xml
    when: always

test_real_api_scheduled:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

test_real_api_manual:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# stage: publish ----------------------
